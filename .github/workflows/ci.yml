name: DataPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datapulse
          POSTGRES_USER: datapulse_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapulse_user -d datapulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: datapulse
      DB_USER: datapulse_user
      DB_PASSWORD: ci_test_password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create vehicles table
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U datapulse_user -d datapulse <<'SQL'
          CREATE TABLE vehicles (
            id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            vin VARCHAR(17) NOT NULL UNIQUE,
            make VARCHAR(100) NOT NULL,
            model VARCHAR(100) NOT NULL,
            model_year INTEGER NOT NULL,
            status VARCHAR(20) NOT NULL DEFAULT 'active',
            created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
          );
          SQL

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build
